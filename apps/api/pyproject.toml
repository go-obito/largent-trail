[project]
name = "largent-api"
version = "0.1.0"
description = "Largent FastAPI service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "arq>=0.26,<1",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "opentelemetry-api>=1.31,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.31,<2",
    "opentelemetry-instrumentation-fastapi>=0.52b0,<1",
    "opentelemetry-sdk>=1.31,<2",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "redis>=5.2,<6",
    "sentry-sdk>=2.20,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "structlog>=24.4,<26",
    "uuid-utils>=0.10,<1",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.14,<2",
    "pip-audit>=2.8,<3",
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1,<2",
    "pytest-cov>=6.0,<7",
    "ruff>=0.9,<1",
    "testcontainers[postgres,redis]>=4.9,<5",
]

[build-system]
requires = ["uv_build>=0.7,<0.8"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "largent"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=largent --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["largent"]

[tool.coverage.report]
show_missing = true
skip_empty = true
