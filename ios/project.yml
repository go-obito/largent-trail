name: Largent
options:
  minimumXcodeGenVersion: 2.41.0
  deploymentTarget:
    iOS: "17.0"
packages:
  clerk-ios:
    url: https://github.com/clerk/clerk-ios
    from: 1.2.0
targets:
  Largent:
    type: application
    configFiles:
      Debug: Config/Defaults.xcconfig
      Release: Config/Defaults.xcconfig
    platform: iOS
    sources:
      - path: Largent
      - path: Shared
    info:
      path: Largent/Info.plist
      properties:
        CFBundleDisplayName: Largent
        UILaunchScreen: {}
        LARGENT_API_BASE_URL: $(LARGENT_API_BASE_URL)
        LARGENT_APP_GROUP_ID: $(LARGENT_APP_GROUP_ID)
        LARGENT_CLERK_PUBLISHABLE_KEY: $(LARGENT_CLERK_PUBLISHABLE_KEY)
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - largent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: site.largent.ios
        SWIFT_VERSION: 6.0
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Largent/Largent.entitlements
        GENERATE_INFOPLIST_FILE: YES
      configs:
        Debug:
          base:
            SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          base:
            SWIFT_COMPILATION_MODE: wholemodule
    dependencies:
      - package: clerk-ios
        product: ClerkKit
      - package: clerk-ios
        product: ClerkKitUI
      - target: LargentWidget
        embed: true
  LargentWidget:
    type: app-extension
    configFiles:
      Debug: Config/Defaults.xcconfig
      Release: Config/Defaults.xcconfig
    platform: iOS
    sources:
      - path: LargentWidget
      - path: Shared
    info:
      path: LargentWidget/Info.plist
      properties:
        CFBundleDisplayName: Largent Widgets
        LARGENT_APP_GROUP_ID: $(LARGENT_APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: site.largent.ios.widget
        SWIFT_VERSION: 6.0
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: LargentWidget/LargentWidget.entitlements
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
